<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="description" content="{{ description }}">
    <meta name="author" content="Xivig Engineering">

    <title>{{ title }}</title>

    <!-- Synchronous Anti-FOUC Theme Preloader -->
    <script>
        (function () {
            try {
                var savedTheme = localStorage.getItem('xivig-theme');
                if (savedTheme === 'dark' || savedTheme === 'light') {
                    document.documentElement.setAttribute('data-theme', savedTheme);
                    document.documentElement.setAttribute('data-bs-theme', savedTheme);
                }
            } catch (e) {}
        })();
    </script>

    <!-- Favicon -->
    <link rel="shortcut icon" type="image/x-icon" href="/src/assets/img/favicon.png" />

    <!-- Google Fonts: Outfit & Plus Jakarta Sans + Source Serif 4 for Magazine Essays -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,700;1,8..60,400&display=swap" rel="stylesheet">

    <!-- Vendor CSS -->
    <link rel="stylesheet" href="/src/assets/vendor/bootstrap/bootstrap.min.css">
    <link rel="stylesheet" href="/src/assets/vendor/bootstrap-icons/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/src/assets/vendor/themify/css/themify-icons.css">
    <link rel="stylesheet" href="/src/assets/vendor/fontawesome/css/all.min.css">
    <link rel="stylesheet" href="/src/assets/vendor/magnific-popup/magnific-popup.css">
    <link rel="stylesheet" href="/src/assets/vendor/slick/slick.css">
    <link rel="stylesheet" href="/src/assets/vendor/slick/slick-theme.css">

    <!-- Xivig Modular Blog Stylesheet -->
    <link rel="stylesheet" href="/src/scss/main.scss">
</head>
